<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; font-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="theme-color" content="#2B6A60">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>轻页主题编辑器</title>
</head>
<body>
  <main id="welcome" class="welcome" hidden></main>
  <div id="editor" class="window" data-pane="stage" hidden>
    <div class="titlebar">
      <button class="tb only-mid" id="btn-parts" aria-label="部件列表" aria-expanded="false">部件</button>
      <button class="tb hide-narrow" id="btn-new" title="Ctrl+N">新建</button>
      <button class="tb hide-narrow" id="btn-open" title="Ctrl+O">打开主题包</button>
      <button class="tb hide-narrow desktop-only" id="btn-open-folder" title="Ctrl+Shift+O">打开文件夹</button>
      <span class="sep hide-narrow"></span>
      <button class="tb" id="btn-undo" title="Ctrl+Z">撤销</button>
      <button class="tb" id="btn-redo" title="Ctrl+Y">重做</button>
      <div class="file" id="file-label"></div>
      <div class="spacer"></div>
      <button class="tb hide-narrow desktop-only" id="btn-save" title="Ctrl+S，写回当前主题包；Ctrl+Shift+S 另存为">保存</button>
      <button class="tb hide-narrow desktop-only" id="btn-folder">导出为文件夹</button>
      <button class="tb hide-narrow" id="btn-shots" title="所有画面的浅色、深色预览拼成一张 PNG">导出截图</button>
      <button class="tb primary" id="btn-export" title="Ctrl+E">导出<span class="hide-narrow"> .qytheme</span></button>
      <button class="tb only-narrow" id="btn-more" aria-label="更多操作">⋯</button>
    </div>
    <div class="body" id="body">
      <nav class="nav" id="nav" aria-label="主题部件"></nav>
      <div class="scrim" id="scrim"></div>
      <div class="stage">
        <div class="stagebar">
          <div class="seg" id="screens"></div>
          <div class="seg" id="shelf-layouts" aria-label="书架布局"></div>
          <div class="seg" id="extra-tab" aria-label="底栏第四个页签"></div>
          <div class="spacer"></div>
          <div class="seg" id="mode-seg" aria-label="预览浅色或深色"></div>
          <div class="seg hide-narrow" id="layout-seg">
            <button data-l="both" aria-pressed="true">浅深并排</button>
            <button data-l="one" aria-pressed="false">只看当前</button>
          </div>
        </div>
        <div class="phones" id="phones"></div>
      </div>
      <aside class="insp" id="insp"></aside>
    </div>
    <div class="issues" id="issues"></div>
    <nav class="mtabs only-narrow" id="mtabs" aria-label="编辑器页面">
      <button data-p="nav">部件</button>
      <button data-p="stage">预览</button>
      <button data-p="insp">设置</button>
    </nav>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
