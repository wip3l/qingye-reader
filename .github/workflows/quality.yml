name: quality
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The AI submodule is private; the default token only covers this repository.
          token: ${{ secrets.AI_ENGINE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/thread-blocking-check.mjs
      - run: node scripts/theme-framework-check.mjs
      - run: node --experimental-strip-types scripts/bookshelf-category-transition-check.mjs
      - run: node --experimental-strip-types scripts/bookshelf-folder-check.mjs
      - run: node --experimental-strip-types scripts/shared-element-book-check.mjs
      - run: node --experimental-strip-types scripts/shared-element-motion-check.mjs
      - run: node --experimental-strip-types scripts/category-swipe-pager-check.mjs
      - run: node --experimental-strip-types scripts/trial-read-shelf-check.mjs
      - run: node --experimental-strip-types scripts/select-font-check.mjs
      - run: node scripts/neutral-source-engine-check.mjs
      - run: node scripts/log-policy-check.mjs
      - run: node scripts/build-help-data.mjs --check
      - run: npm --prefix harmony-book-ai-engine test
      - run: node --experimental-strip-types scripts/ai-host-runtime-check.mjs
      - run: node --experimental-strip-types scripts/reader-cache-budget-check.mjs
      - run: node --experimental-strip-types scripts/comic-colorizer-check.mjs
      - run: node --experimental-strip-types scripts/comic-text-check.mjs
      - run: node --experimental-strip-types scripts/member-reader-settings-check.mjs
      - run: node --experimental-strip-types scripts/ai-trial-check.mjs
      # 这些检查会导入 entry 下的 TypeScript 模块，需要 Node 的类型擦除能力。
      - run: node --experimental-strip-types scripts/java-regex-compat-check.mjs
      - run: node --experimental-strip-types scripts/replace-rule-import-check.mjs
      - run: node --experimental-strip-types scripts/opds-parser-check.mjs
      - run: node --experimental-strip-types scripts/opds-kavita-check.mjs
      - run: node --experimental-strip-types scripts/epub-converter-check.mjs
      - run: node --experimental-strip-types scripts/epub-mixed-layout-check.mjs
      - run: node --experimental-strip-types scripts/reader-text-normalizer-check.mjs
      - run: node --experimental-strip-types scripts/reader-chunk-pagination-check.mjs
      - run: node --experimental-strip-types scripts/reader-continuous-page-metrics-check.mjs
      - run: node --experimental-strip-types scripts/reader-screen-scroll-check.mjs
      - run: node --experimental-strip-types scripts/reader-scroll-gesture-check.mjs
      - run: node --experimental-strip-types scripts/reader-font-weight-check.mjs
      - run: node --experimental-strip-types scripts/comic-image-pipeline-check.mjs
      - run: node --experimental-strip-types scripts/image-script-check.mjs
      - run: node --experimental-strip-types scripts/network-compatibility-check.mjs
      # 书源解析内核（子模块）自己的回归检查。
      - run: for f in harmony-book-source-engine/scripts/*-check.mjs; do node --experimental-strip-types "$f" || exit 1; done
